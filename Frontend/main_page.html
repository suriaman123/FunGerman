<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun German - Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FFF9F0;
    --card:#FFFFFF;
    --purple:#7C3AED;
    --purple-light:#EDE9FE;
    --green:#16A34A;
    --green-light:#DCFCE7;
    --red:#DC2626;
    --red-light:#FEE2E2;
    --amber:#D97706;
    --amber-light:#FEF3C7;
    --blue:#2563EB;
    --blue-light:#DBEAFE;
    --pink:#EC4899;
    --pink-light:#FCE7F3;
    --text:#1E1B4B;
    --muted:#6B7280;
    --border:#E5E7EB;
    --shadow:0 4px 24px rgba(124,58,237,0.10);
    --radius:18px;
  }
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  h1,h2,.title-font{font-family:'Fredoka One',cursive}

  /* Animated background */
  .bg-shapes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .shape{position:absolute;border-radius:50%;opacity:0.13;animation:float 8s ease-in-out infinite}
  .shape:nth-child(1){width:220px;height:220px;background:var(--purple);top:-60px;left:-60px;animation-delay:0s}
  .shape:nth-child(2){width:160px;height:160px;background:var(--pink);top:40%;right:-50px;animation-delay:2s}
  .shape:nth-child(3){width:130px;height:130px;background:var(--amber);bottom:-40px;left:30%;animation-delay:4s}
  .shape:nth-child(4){width:90px;height:90px;background:var(--green);top:20%;left:60%;animation-delay:1s}
  @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.04)}}

  .app{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:16px}

  /* Header */
  .header{text-align:center;padding:18px 0 10px}
  .logo{font-size:2.6rem;color:var(--purple);letter-spacing:1px;line-height:1}
  .logo span{color:var(--pink)}
  .logo-sub{font-size:1rem;color:var(--muted);margin-top:2px}
  
  /* Setup screen */
  .setup-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px 24px;border:2px solid var(--purple-light)}
  .section-title{font-family:'Fredoka One',cursive;font-size:1.3rem;color:var(--purple);margin-bottom:14px}
  .option-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .opt-btn{padding:8px 18px;border-radius:30px;border:2px solid var(--border);background:var(--card);font-family:'Nunito',sans-serif;font-weight:700;font-size:0.95rem;cursor:pointer;transition:all .18s;color:var(--text)}
  .opt-btn:hover{border-color:var(--purple);color:var(--purple)}
  .opt-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 2px 8px rgba(124,58,237,0.25)}
  .start-btn{width:100%;padding:15px;border-radius:40px;border:none;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-family:'Fredoka One',cursive;font-size:1.4rem;letter-spacing:1px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 18px rgba(124,58,237,0.30);margin-top:6px}
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(124,58,237,0.38)}

  /* Coin toss */
  .toss-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 24px;text-align:center;border:2px solid var(--amber-light)}
  .coin-wrap{margin:24px auto;width:130px;height:130px;position:relative}
  .coin{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.2rem;cursor:pointer;transition:transform .1s;animation:coinSpin 0s;border:4px solid var(--amber);background:linear-gradient(135deg,#FDE68A,#FCD34D)}
  .coin:hover{transform:scale(1.06)}
  .coin.spinning{animation:coinSpin .6s linear}
  @keyframes coinSpin{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
  .toss-choices{display:flex;gap:16px;justify-content:center;margin:20px 0}
  .toss-btn{padding:12px 32px;border-radius:30px;font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;border:2px solid;transition:all .15s}
  .toss-btn.heads{background:var(--amber-light);border-color:var(--amber);color:var(--amber)}
  .toss-btn.tails{background:var(--purple-light);border-color:var(--purple);color:var(--purple)}
  .toss-btn:hover{transform:scale(1.07)}
  .toss-result{font-family:'Fredoka One',cursive;font-size:1.5rem;margin-top:14px;min-height:36px}

  /* Game screen */
  .game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .hearts{display:flex;gap:6px}
  .heart{font-size:1.7rem;transition:all .3s}
  .heart.lost{filter:grayscale(1);opacity:0.35;transform:scale(0.85)}
  .timer-wrap{display:flex;align-items:center;gap:8px}
  .timer{font-family:'Fredoka One',cursive;font-size:1.6rem;color:var(--purple);min-width:48px;text-align:center}
  .timer.urgent{color:var(--red);animation:pulse .5s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .level-badge{background:var(--purple-light);color:var(--purple);border-radius:20px;padding:5px 14px;font-weight:800;font-size:0.85rem}
  
  /* Word chain */
  .chain-area{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:14px;min-height:90px;max-height:220px;overflow-y:auto;border:2px solid var(--purple-light)}
  .chain-word{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;margin:4px;font-weight:700;font-size:1rem;cursor:default;transition:transform .15s}
  .chain-word.user-word{background:var(--blue-light);color:var(--blue);border:1.5px solid var(--blue)}
  .chain-word.computer-word{background:var(--green-light);color:var(--green);border:1.5px solid var(--green);cursor:pointer}
  .chain-word.computer-word:hover{transform:scale(1.05)}
  .chain-arrow{color:var(--muted);font-size:1.1rem}
  .chain-prompt{color:var(--muted);font-style:italic;font-size:0.95rem}
  
  /* Current letter indicator */
  .letter-prompt{text-align:center;margin-bottom:14px;padding:14px;background:var(--amber-light);border-radius:14px;border:2px dashed var(--amber)}
  .letter-big{font-family:'Fredoka One',cursive;font-size:2.8rem;color:var(--amber);display:inline-block;animation:bounce .6s ease-in-out}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .letter-hint{font-size:0.95rem;color:var(--amber);font-weight:700}

  /* Starting letters choice */
  .start-letters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
  .letter-choice{width:54px;height:54px;border-radius:14px;border:2.5px solid var(--border);background:var(--card);font-family:'Fredoka One',cursive;font-size:1.5rem;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;color:var(--text)}
  .letter-choice:hover{border-color:var(--purple);background:var(--purple-light);color:var(--purple);transform:translateY(-3px)}

  /* Input */
  .input-area{display:flex;gap:10px;margin-bottom:14px}
  .word-input{flex:1;padding:13px 18px;border-radius:30px;border:2.5px solid var(--border);font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:700;outline:none;transition:border-color .2s;background:var(--card);color:var(--text)}
  .word-input:focus{border-color:var(--purple)}
  .submit-btn{padding:13px 24px;border-radius:30px;border:none;background:var(--purple);color:#fff;font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;transition:all .15s;white-space:nowrap}
  .submit-btn:hover{background:#6D28D9;transform:scale(1.04)}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}

  /* Feedback toast */
  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:12px 28px;border-radius:30px;font-family:'Fredoka One',cursive;font-size:1.15rem;z-index:999;pointer-events:none;opacity:0;transition:opacity .25s}
  .toast.show{opacity:1}
  .toast.ok{background:var(--green);color:#fff}
  .toast.err{background:var(--red);color:#fff}
  .toast.info{background:var(--purple);color:#fff}

  /* Flashcard modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--card);border-radius:var(--radius);padding:28px 24px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.18);position:relative;transform:translateY(20px);transition:transform .25s}
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal-word{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--purple);margin-bottom:6px}
  .modal-level{display:inline-block;background:var(--purple-light);color:var(--purple);border-radius:10px;padding:3px 12px;font-size:0.8rem;font-weight:800;margin-bottom:12px}
  .modal-def{font-size:1rem;color:var(--text);margin-bottom:12px;line-height:1.6}
  .modal-ex{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:8px;padding:10px 14px;font-size:0.95rem;color:var(--blue);font-style:italic}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--muted)}
  .modal-loading{text-align:center;padding:20px;color:var(--muted);font-size:1rem}
  .dots{display:inline-block;animation:dotdot 1.2s infinite}
  @keyframes dotdot{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}

  /* Surrender / action row */
  .action-row{display:flex;gap:10px;justify-content:center;margin-top:6px}
  .surrender-btn{padding:9px 22px;border-radius:30px;border:2px solid var(--red);background:var(--red-light);color:var(--red);font-family:'Nunito',sans-serif;font-weight:800;font-size:0.9rem;cursor:pointer;transition:all .15s}
  .surrender-btn:hover{background:var(--red);color:#fff}

  /* End screen */
  .end-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 24px;text-align:center;border:3px solid var(--purple-light)}
  .end-emoji{font-size:4rem;margin-bottom:12px;display:block}
  .end-title{font-family:'Fredoka One',cursive;font-size:2rem;margin-bottom:8px}
  .end-stats{background:var(--purple-light);border-radius:14px;padding:14px 20px;margin:14px 0;text-align:left;font-weight:600}
  .play-again-btn{padding:14px 40px;border-radius:40px;border:none;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-family:'Fredoka One',cursive;font-size:1.3rem;cursor:pointer;margin-top:10px;box-shadow:0 4px 18px rgba(124,58,237,0.28);transition:transform .15s}
  .play-again-btn:hover{transform:scale(1.05)}

  /* thinking indicator */
  .thinking{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:var(--green-light);color:var(--green);font-weight:700;font-size:0.9rem;margin-bottom:10px;width:fit-content}
  .thinking-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin:0 1.5px;animation:blink 1.2s infinite}
  .thinking-dots span:nth-child(2){animation-delay:.2s}
  .thinking-dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:0.3}40%{opacity:1}}

  .word-count{font-size:0.85rem;color:var(--muted);text-align:center;margin-bottom:8px}

  @media(max-width:480px){
    .logo{font-size:2rem}
    .letter-big{font-size:2.2rem}
    .toss-btn{padding:10px 22px}
  }
</style>
</head>
<body>
<div class="bg-shapes">
  <div class="shape"></div><div class="shape"></div><div class="shape"></div><div class="shape"></div>
</div>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const API_URL = "https://api.anthropic.com/v1/messages";
const MODEL = "claude-sonnet-4-20250514";

let state = {
  screen: 'setup', // setup | toss | choose-letter | game | end
  language: 'German',
  level: 'A1',
  chain: [], // [{word, source:'user'|'computer', letter_shown}]
  hearts: 3,
  timer: 60,
  timerInterval: null,
  currentLetter: '',
  isComputing: false,
  totalWords: 0,
  gameResult: '', // 'win' | 'lose' | 'surrender'
  startLetters: [],
  selectedStartLetter: '',
  consecutiveWrong: 0,
};

// --- API helpers ---
async function callClaude(messages, systemPrompt) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 1000,
      system: systemPrompt,
      messages
    })
  });
  const data = await res.json();
  return data.content?.[0]?.text || '';
}

async function validateUserWord(word, mustStartWith, level) {
  const sys = `You are a German language expert. Respond ONLY with a JSON object, no markdown.`;
  const msg = `Check if "${word}" is a valid German noun/word that starts with the letter "${mustStartWith.toUpperCase()}" (case-insensitive check on first letter).
Return JSON: {"valid": true/false, "reason": "brief reason if invalid", "is_german": true/false}
A word is valid if: it exists in German vocabulary AND starts with "${mustStartWith}". Proper nouns are allowed. Accept any German word.`;
  try {
    const txt = await callClaude([{role:'user',content:msg}], sys);
    const clean = txt.replace(/```json|```/g,'').trim();
    return JSON.parse(clean);
  } catch(e) { return {valid: true, is_german: true}; }
}

async function getComputerWord(mustStartWith, level, usedWords) {
  const sys = `You are a German language teacher. Respond ONLY with a JSON object.`;
  const usedStr = usedWords.length ? `Avoid these already-used words: ${usedWords.join(', ')}.` : '';
  const levelDesc = {A1:'very basic (colors, numbers, body parts, family, food, animals, days)',A2:'elementary (house, school, weather, hobbies, simple verbs)',B1:'intermediate (work, travel, health, environment, common idioms)',B2:'upper-intermediate (abstract nouns, compound words, formal vocabulary)',C1:'advanced (technical terms, nuanced vocabulary, less common words)',C2:'mastery (rare, sophisticated, literary vocabulary)'};
  const msg = `Give me a German word at level ${level} (${levelDesc[level]||'common vocabulary'}) that starts with the letter "${mustStartWith.toUpperCase()}".
${usedStr}
The word should be appropriate for a vocabulary game. Include its article if it's a noun (der/die/das).
Return JSON: {"word": "the German word without article for game use", "display": "article + word if noun, else just word", "definition_en": "short English definition", "example_de": "one example sentence in German", "example_en": "English translation of example"}
If NO word exists at this level for this letter, return: {"word": null, "concede": true}`;
  try {
    const txt = await callClaude([{role:'user',content:msg}], sys);
    const clean = txt.replace(/```json|```/g,'').trim();
    return JSON.parse(clean);
  } catch(e) { return {word: null, concede: true}; }
}

async function getWordInfo(word, level) {
  const sys = `You are a German language teacher. Respond ONLY with JSON.`;
  const msg = `Give me information about the German word "${word}".
Return JSON: {"word":"${word}", "display":"article + word if noun", "definition_en":"clear English definition", "example_de":"example sentence in German using this word", "example_en":"English translation", "level":"CEFR level"}`;
  try {
    const txt = await callClaude([{role:'user',content:msg}], sys);
    const clean = txt.replace(/```json|```/g,'').trim();
    return JSON.parse(clean);
  } catch(e) { return null; }
}

async function getStartLetters() {
  const sys = `You are a helpful assistant. Respond only with JSON.`;
  const msg = `Give me 5 random German alphabet letters (uppercase) that are good starting letters for German words at ${state.level} level vocabulary. Include at least some vowels.
Return JSON: {"letters": ["A","B","C","D","E"]}`;
  try {
    const txt = await callClaude([{role:'user',content:msg}], sys);
    const clean = txt.replace(/```json|```/g,'').trim();
    const data = JSON.parse(clean);
    return data.letters || ['A','E','I','S','T'];
  } catch(e) { return ['A','E','I','S','T']; }
}

// --- Toast ---
let toastTimer;
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className='toast'; }, 2500);
}

// --- Modal ---
async function openWordModal(word) {
  const modal = document.getElementById('modal');
  const content = document.getElementById('modal-content');
  content.innerHTML = `<div class="modal-loading">Looking up <b>${word}</b><span class="dots">...</span></div>`;
  modal.classList.add('open');
  const info = await getWordInfo(word, state.level);
  if(!info){ content.innerHTML=`<div class="modal-loading">Couldn't load info for <b>${word}</b></div>`; return; }
  content.innerHTML = `
    <div class="modal-word">${info.display||word}</div>
    <span class="modal-level">${info.level||state.level}</span>
    <div class="modal-def">${info.definition_en}</div>
    <div class="modal-ex">${info.example_de}<br><br><span style="color:#1E40AF;font-style:normal;font-size:0.88rem">${info.example_en}</span></div>
  `;
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target===document.getElementById('modal')) closeModal(); });

// --- Timer ---
function startTimer() {
  clearInterval(state.timerInterval);
  state.timer = 60;
  state.timerInterval = setInterval(()=>{
    state.timer--;
    renderTimerOnly();
    if(state.timer <= 0) { clearInterval(state.timerInterval); handleTimeout(); }
  }, 1000);
}
function stopTimer() { clearInterval(state.timerInterval); }

function renderTimerOnly() {
  const el = document.getElementById('timer-display');
  if(el) {
    el.textContent = state.timer + 's';
    el.className = 'timer' + (state.timer <= 10 ? ' urgent' : '');
  }
}

function handleTimeout() {
  state.hearts--;
  state.consecutiveWrong++;
  showToast('⏰ Time up! Lost a heart!', 'err');
  if(state.hearts <= 0 || state.consecutiveWrong >= 3) { endGame('lose'); return; }
  render();
  startTimer();
}

// --- Last letter of word ---
function lastLetter(word) {
  const clean = word.replace(/[^a-zA-ZäöüÄÖÜß]/g,'');
  return clean[clean.length-1]?.toUpperCase() || '';
}

// --- Game actions ---
async function handleUserSubmit() {
  const input = document.getElementById('word-input');
  if(!input) return;
  const word = input.value.trim();
  if(!word || state.isComputing) return;

  stopTimer();
  state.isComputing = true;
  input.disabled = true;
  document.getElementById('submit-btn').disabled = true;
  render();

  // Validate
  const result = await validateUserWord(word, state.currentLetter, state.level);
  
  if(!result.valid || !result.is_german) {
    state.hearts--;
    state.consecutiveWrong++;
    showToast(result.reason || 'Not a valid German word! ❌', 'err');
    state.isComputing = false;
    if(state.hearts <= 0 || state.consecutiveWrong >= 3) { endGame('lose'); return; }
    render();
    startTimer();
    return;
  }

  state.consecutiveWrong = 0;
  state.chain.push({word: word.toLowerCase(), display: word, source:'user'});
  state.totalWords++;
  state.currentLetter = lastLetter(word);
  showToast('Richtig! ✅ Gut gemacht!', 'ok');

  // Computer's turn
  render();
  await computerTurn();
}

async function computerTurn() {
  state.isComputing = true;
  render();
  const usedWords = state.chain.map(c=>c.word);
  const compWord = await getComputerWord(state.currentLetter, state.level, usedWords);

  if(!compWord || compWord.concede || !compWord.word) {
    showToast('Computer hat keine Wörter mehr! Du gewinnst! 🏆', 'ok');
    endGame('win');
    return;
  }

  state.chain.push({
    word: compWord.word.toLowerCase(),
    display: compWord.display || compWord.word,
    source: 'computer',
    info: compWord
  });
  state.totalWords++;
  state.currentLetter = lastLetter(compWord.word);
  state.isComputing = false;
  render();
  startTimer();
}

function endGame(result) {
  stopTimer();
  state.gameResult = result;
  state.screen = 'end';
  state.isComputing = false;
  render();
}

function handleSurrender() {
  stopTimer();
  endGame('surrender');
}

// --- Main render ---
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'header';
  hdr.innerHTML = `<div class="logo">Fun<span>German</span></div><div class="logo-sub">🇩🇪 Das Wörter-Abenteuer</div>`;
  app.appendChild(hdr);

  if(state.screen === 'setup') renderSetup(app);
  else if(state.screen === 'toss') renderToss(app);
  else if(state.screen === 'choose-letter') renderChooseLetter(app);
  else if(state.screen === 'game') renderGame(app);
  else if(state.screen === 'end') renderEnd(app);
}

function renderSetup(app) {
  const card = document.createElement('div');
  card.className = 'setup-card';
  card.innerHTML = `
    <div class="section-title">🌍 Choose Language</div>
    <div class="option-row">
      <button class="opt-btn active" id="lang-de">🇩🇪 German</button>
      <button class="opt-btn" style="opacity:.5;cursor:not-allowed" title="Coming soon">🇫🇷 French (soon)</button>
      <button class="opt-btn" style="opacity:.5;cursor:not-allowed" title="Coming soon">🇪🇸 Spanish (soon)</button>
    </div>
    <div class="section-title">🎓 Computer Level</div>
    <div class="option-row" id="level-opts">
      ${['A1','A2','B1','B2','C1','C2'].map(l=>`<button class="opt-btn level-btn ${l===state.level?'active':''}" data-level="${l}">${l}</button>`).join('')}
    </div>
    <div style="background:var(--purple-light);border-radius:12px;padding:14px 16px;margin-bottom:18px">
      <b style="color:var(--purple)">🎮 How to play Atlas:</b><br>
      <span style="font-size:0.9rem;color:var(--text)">Win the coin toss → pick a starting letter. Each player must say a German word starting with the last letter of the previous word. Computer uses ${state.level} vocabulary. You have 60 seconds and 3 hearts. Click any computer word for a flashcard! 📚</span>
    </div>
    <button class="start-btn" id="start-btn">🚀 Start Spielen!</button>
  `;
  app.appendChild(card);

  card.querySelectorAll('.level-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.level = btn.dataset.level;
      card.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  card.querySelector('#start-btn').addEventListener('click', ()=>{
    state.screen = 'toss';
    render();
  });
}

function renderToss(app) {
  const card = document.createElement('div');
  card.className = 'toss-card';
  card.innerHTML = `
    <div class="title-font" style="font-size:1.8rem;color:var(--amber);margin-bottom:6px">🪙 Coin Toss!</div>
    <div style="color:var(--muted);margin-bottom:10px">Choose your side, then flip the coin!</div>
    <div class="coin-wrap"><div class="coin" id="coin">🪙</div></div>
    <div class="toss-choices">
      <button class="toss-btn heads" id="btn-heads">👑 Heads</button>
      <button class="toss-btn tails" id="btn-tails">🦅 Tails</button>
    </div>
    <div class="toss-result" id="toss-result"></div>
  `;
  app.appendChild(card);

  let chosen = null;
  card.querySelector('#btn-heads').addEventListener('click',()=>{ chosen='heads'; flip(); });
  card.querySelector('#btn-tails').addEventListener('click',()=>{ chosen='tails'; flip(); });

  function flip() {
    if(!chosen) return;
    const coin = card.querySelector('#coin');
    coin.classList.add('spinning');
    const resultEl = card.querySelector('#toss-result');
    resultEl.textContent = '';
    setTimeout(()=>{
      coin.classList.remove('spinning');
      const outcomes = ['heads','tails'];
      const result = outcomes[Math.floor(Math.random()*2)];
      const userWon = chosen === result;
      coin.textContent = result==='heads'?'👑':'🦅';
      if(userWon) {
        resultEl.innerHTML = `<span style="color:var(--green)">🎉 You won the toss!</span><br><span style="font-size:1rem;color:var(--muted)">Pick your starting letter!</span>`;
        setTimeout(async()=>{ 
          state.startLetters = await getStartLetters();
          state.screen = 'choose-letter';
          render();
        }, 1500);
      } else {
        resultEl.innerHTML = `<span style="color:var(--red)">😅 Computer goes first!</span><br><span style="font-size:1rem;color:var(--muted)">Preparing first word...</span>`;
        setTimeout(async()=>{
          state.screen = 'game';
          state.chain = [];
          state.hearts = 3;
          state.consecutiveWrong = 0;
          // Computer picks starting letter and word
          const letters = 'ABCDEFGHIKLMNOPRSTW'.split('');
          const randomLetter = letters[Math.floor(Math.random()*letters.length)];
          state.currentLetter = randomLetter;
          state.isComputing = true;
          render();
          await computerTurn();
        }, 1800);
      }
    }, 700);
  }
}

function renderChooseLetter(app) {
  const card = document.createElement('div');
  card.className = 'toss-card';
  card.innerHTML = `
    <div class="title-font" style="font-size:1.6rem;color:var(--purple);margin-bottom:8px">🅰️ Pick Your Starting Letter</div>
    <div style="color:var(--muted);margin-bottom:16px">Choose a letter — your first word must start with it!</div>
    <div class="start-letters" id="letter-choices">
      ${state.startLetters.map(l=>`<button class="letter-choice" data-letter="${l}">${l}</button>`).join('')}
    </div>
  `;
  app.appendChild(card);
  
  card.querySelectorAll('.letter-choice').forEach(btn=>{
    btn.addEventListener('click', async()=>{
      state.selectedStartLetter = btn.dataset.letter;
      state.currentLetter = btn.dataset.letter;
      state.chain = [];
      state.hearts = 3;
      state.consecutiveWrong = 0;
      state.screen = 'game';
      state.isComputing = false;
      render();
      startTimer();
    });
  });
}

function renderGame(app) {
  // Hearts & timer
  const gameHdr = document.createElement('div');
  gameHdr.className = 'game-header';
  gameHdr.innerHTML = `
    <div class="hearts">${[0,1,2].map(i=>`<span class="heart ${i>=state.hearts?'lost':''}">❤️</span>`).join('')}</div>
    <div class="level-badge">${state.level} · ${state.language}</div>
    <div class="timer-wrap">⏱ <span class="timer" id="timer-display">${state.timer}s</span></div>
  `;
  app.appendChild(gameHdr);

  // Chain
  const chain = document.createElement('div');
  chain.className = 'chain-area';
  if(state.chain.length === 0) {
    chain.innerHTML = `<span class="chain-prompt">Words will appear here... Good luck! 🍀</span>`;
  } else {
    state.chain.forEach((item, idx)=>{
      const span = document.createElement('span');
      span.className = `chain-word ${item.source==='user'?'user-word':'computer-word'}`;
      span.innerHTML = `${item.source==='user'?'👤':'🤖'} ${item.display}`;
      if(item.source==='computer') {
        span.title = 'Click for flashcard!';
        span.addEventListener('click',()=>openWordModal(item.word));
      }
      chain.appendChild(span);
      if(idx < state.chain.length-1) {
        const arrow = document.createElement('span');
        arrow.className = 'chain-arrow';
        arrow.textContent = ' → ';
        chain.appendChild(arrow);
      }
    });
    // Auto scroll
    setTimeout(()=>{ chain.scrollTop = chain.scrollHeight; }, 50);
  }
  app.appendChild(chain);

  // Word count
  const wc = document.createElement('div');
  wc.className = 'word-count';
  wc.textContent = `${state.totalWords} word${state.totalWords!==1?'s':''} played`;
  app.appendChild(wc);

  // Thinking indicator
  if(state.isComputing) {
    const think = document.createElement('div');
    think.className = 'thinking';
    think.innerHTML = `🤖 Computer is thinking<span class="thinking-dots"><span></span><span></span><span></span></span>`;
    app.appendChild(think);
  }

  // Current letter prompt
  if(!state.isComputing) {
    const lp = document.createElement('div');
    lp.className = 'letter-prompt';
    lp.innerHTML = `<div class="letter-hint">Your word must start with:</div><div class="letter-big">${state.currentLetter}</div>`;
    app.appendChild(lp);

    // Input
    const inputArea = document.createElement('div');
    inputArea.className = 'input-area';
    inputArea.innerHTML = `<input class="word-input" id="word-input" placeholder="Type a German word starting with ${state.currentLetter}..." maxlength="40" autocomplete="off" autocapitalize="off"><button class="submit-btn" id="submit-btn">Senden →</button>`;
    app.appendChild(inputArea);

    const inp = inputArea.querySelector('#word-input');
    const btn = inputArea.querySelector('#submit-btn');
    inp.focus();
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') handleUserSubmit(); });
    btn.addEventListener('click', handleUserSubmit);

    // Surrender
    const actions = document.createElement('div');
    actions.className = 'action-row';
    actions.innerHTML = `<button class="surrender-btn" id="surr-btn">🏳️ Surrender</button>`;
    app.appendChild(actions);
    actions.querySelector('#surr-btn').addEventListener('click', ()=>{
      if(confirm('Are you sure you want to surrender? 😢')) handleSurrender();
    });
  }
}

function renderEnd(app) {
  const isWin = state.gameResult === 'win';
  const isSurrender = state.gameResult === 'surrender';
  const card = document.createElement('div');
  card.className = 'end-card';
  card.innerHTML = `
    <span class="end-emoji">${isWin?'🏆':isSurrender?'🏳️':'💔'}</span>
    <div class="end-title" style="color:${isWin?'var(--green)':isSurrender?'var(--amber)':'var(--red)'}">${isWin?'Du hast gewonnen!':isSurrender?'Aufgegeben!':'Spiel vorbei!'}</div>
    <div style="color:var(--muted);margin-bottom:10px">${isWin?'The computer ran out of words. Amazing vocabulary!':isSurrender?'No shame in that. Practice makes perfect!':'Better luck next time, keep learning!'}</div>
    <div class="end-stats">
      <div>🔤 Words played: <b>${state.totalWords}</b></div>
      <div>❤️ Hearts remaining: <b>${state.hearts}/3</b></div>
      <div>🎓 Level played: <b>${state.level}</b></div>
      <div>📚 Chain length: <b>${state.chain.length} words</b></div>
    </div>
    ${state.chain.length>0?`<div style="margin:10px 0;font-size:0.9rem;color:var(--muted)">Click any computer word in your chain to review it! 👇</div>
    <div class="chain-area" style="max-height:120px">${state.chain.map(item=>`<span class="chain-word ${item.source==='user'?'user-word':'computer-word'}" ${item.source==='computer'?`onclick="openWordModal('${item.word}')" title="Click for flashcard!"`:''}>${item.source==='user'?'👤':'🤖'} ${item.display}</span>`).join(' → ')}</div>`:''}
    <button class="play-again-btn" id="play-again">🎮 Play Again!</button>
  `;
  app.appendChild(card);
  card.querySelector('#play-again').addEventListener('click', ()=>{
    state = {screen:'setup',language:'German',level:state.level,chain:[],hearts:3,timer:60,timerInterval:null,currentLetter:'',isComputing:false,totalWords:0,gameResult:'',startLetters:[],selectedStartLetter:'',consecutiveWrong:0};
    render();
  });
}

// Init
render();
</script>
</body>
</html>
